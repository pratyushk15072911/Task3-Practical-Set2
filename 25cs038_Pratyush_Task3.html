<!DOCTYPE html>
<html>

<head>

    <title>Online Product Order</title>

    <style>

        body {
            font-family: Arial;
            background-color: #eeeeee;
        }

        #mainTitle {
            text-align: center;
            color: darkred;
        }

        #orderBox {
            width: 450px;
            border: 2px solid black;
            margin: 20px auto;
            padding: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .bill {
            width: 450px;
            border: 2px solid green;
            margin: 20px auto;
            padding: 15px;
        }

        #orderButton {
            padding: 10px;
            background: lightblue;
            cursor: pointer;
        }

    </style>

</head>

<body>

<h1 id="mainTitle">Online Product Order</h1>

<div id="orderBox">

    <div class="field">

        <label for="customer">Customer Name:</label>

        <input type="text" id="customer">

    </div>

    <div class="field">

        <label for="product">Select Product:</label>

        <select id="product">

            <option value="">Select Product</option>

            <option value="Laptop">Laptop - Rs. 50000</option>

            <option value="Mobile">Mobile - Rs. 20000</option>

            <option value="Keyboard">Keyboard - Rs. 1500</option>

        </select>

    </div>

    <div class="field">

        <label for="quantity">Quantity:</label>

        <input type="number" id="quantity" min="1">

    </div>

    <button type="button" id="orderButton" onclick="calculateBill()">

        Generate Bill

    </button>

</div>

<div id="billBox" class="bill">

    Bill will appear here.

</div>

<script>

function calculateBill() {

    var customer = document.getElementById("customer").value.trim();
    var product = document.getElementById("product").value;
    var quantityStr = document.getElementById("quantity").value.trim();

    // 1. Validate Required Fields
    if (customer === "" || product === "" || quantityStr === "") {
        alert("Please fill in Customer Name, Product, and Quantity.");
        return;
    }

    // 2. Validate Quantity
    var quantity = parseInt(quantityStr, 10);
    if (isNaN(quantity) || quantity <= 0) {
        alert("Quantity must be a valid positive number.");
        return;
    }

    // 3. Determine Unit Price
    var price = 0;
    if (product === "Laptop") {
        price = 50000;
    } else if (product === "Mobile") {
        price = 20000;
    } else if (product === "Keyboard") {
        price = 1500;
    }

    // 4. Calculate Total
    var total = price * quantity;

    // 5. Prompt for Customer Type
    var customerType = prompt("Enter Customer Type (Regular / Premium):");

    if (customerType === null || (customerType.trim() !== "Regular" && customerType.trim() !== "Premium")) {
        alert("Invalid or cancelled Customer Type. Bill generation stopped.");
        return;
    }
    customerType = customerType.trim();

    // 6. Ask Confirmation
    var order = confirm("Do you want to place this order?");

    if (!order) {
        alert("Order was cancelled.");
        return;
    }

    // 7. Render Bill to Output Box
    document.getElementById("billBox").innerHTML =
        "<h2>Order Bill</h2>" +
        "Customer: " + customer +
        "<br>Product: " + product +
        "<br>Price: Rs. " + price +
        "<br>Quantity: " + quantity +
        "<br>Total Amount: Rs. " + total +
        "<br>Customer Type: " + customerType;

    // 8. Success Message
    alert("Order placed successfully");

}

</script>

</body>

</html>
